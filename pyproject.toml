[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langmem-eval"
version = "0.2.0"
description = "LangMem methods and MemEval benchmarks in one research package"
readme = "README.md"
# PyTorch 2.7.1 publishes wheels for Python 3.12/3.13, not 3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
  "langmem==0.0.30",
  "huggingface-hub",
  "hindsight-client>=0.4.13",
  "numpy>=2.4.2",
  "openai>=1.0.0",
  "python-dotenv>=1.2.1",
  "tqdm>=4.67.3",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
aml = ["fastapi>=0.115", "uvicorn>=0.30"]
amem = [
  "torch==2.7.1",
  "sentence-transformers==5.1.2",
  "transformers==4.57.6",
]
mem0 = ["mem0ai>=0.1.0"]
simplemem = ["simplemem>=0.1.0"]
graphiti = ["graphiti-core[kuzu]>=0.5"]
memu = ["memu-py>=1.3.0; python_version >= '3.13'"]
charts = ["pandas>=2.0.0", "matplotlib>=3.10.8"]
training = ["torch==2.7.1", "transformers>=4.45.0,<5", "trl>=0.12.0",
            "peft>=0.13.0", "datasets>=3.0.0", "bitsandbytes>=0.44.0",
            "accelerate>=1.0.0"]

# The Linux x86_64 server uses an older NVIDIA driver; avoid PyPI's newer CUDA builds.
# Windows development uses CPU wheels; other platforms use PyPI's platform wheels.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
langmem-eval = "langmem_eval.cli:main"
langmem-aml = "langmem_eval.aml.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/langmem_eval", "src/agents_memory"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/memeval/LICENSE" = "agents_memory/LICENSE"
"third_party/memeval/NOTICE" = "agents_memory/NOTICE"
"third_party/amem/LICENSE" = "langmem_eval/AMEM_LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
