[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langmem-eval"
version = "0.2.0"
description = "LangMem methods and MemEval benchmarks in one research package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langmem==0.0.30",
  "huggingface-hub",
  "hindsight-client>=0.4.13",
  "numpy>=2.4.2",
  "openai>=1.0.0",
  "python-dotenv>=1.2.1",
  "tqdm>=4.67.3",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
aml = ["fastapi>=0.115", "uvicorn>=0.30"]
amem = ["sentence-transformers>=3.0"]
mem0 = ["mem0ai>=0.1.0"]
simplemem = ["simplemem>=0.1.0"]
graphiti = ["graphiti-core[kuzu]>=0.5"]
memu = ["memu-py>=1.3.0; python_version >= '3.13'"]
charts = ["pandas>=2.0.0", "matplotlib>=3.10.8"]
training = ["torch>=2.0.0", "transformers>=4.45.0", "trl>=0.12.0",
            "peft>=0.13.0", "datasets>=3.0.0", "bitsandbytes>=0.44.0",
            "accelerate>=1.0.0"]

[project.scripts]
langmem-eval = "langmem_eval.cli:main"
langmem-aml = "langmem_eval.aml.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/langmem_eval", "src/agents_memory"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/memeval/LICENSE" = "agents_memory/LICENSE"
"third_party/memeval/NOTICE" = "agents_memory/NOTICE"
"third_party/amem/LICENSE" = "langmem_eval/AMEM_LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
